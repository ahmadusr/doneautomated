<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoneAutomated Dashboard</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}

.sidebar {
  width: 250px;
  height: 100vh;
  position: fixed;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding: 20px;
}

.sidebar h2 {
  text-align: center;
  color: #00f7ff;
}

.sidebar ul {
  list-style: none;
  padding: 0;
}

.sidebar ul li {
  padding: 15px;
  margin: 10px 0;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.sidebar ul li:hover {
  background: #00f7ff;
  color: black;
}

.main {
  margin-left: 270px;
  padding: 20px;
}

.header {
  font-size: 24px;
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.card {
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  box-shadow: 0 0 20px rgba(0,255,255,0.2);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card h3 {
  margin: 0;
}

.card p {
  font-size: 20px;
  color: #00f7ff;
}

</style>
</head>

<body>

<div class="sidebar">
  <h2>DoneAutomated</h2>
  <ul>
    <li>Dashboard</li>
    <li>Services</li>
    <li>Analytics</li>
    <li>Settings</li>
  </ul>
</div>

<div class="main">
  <div class="header">Welcome Back 👋</div>

  <div class="cards">
    <div class="card">
      <h3>Total Projects</h3>
      <p>24</p>
    </div>

    <div class="card">
      <h3>Active Clients</h3>
      <p>12</p>
    </div>

    <div class="card">
      <h3>Revenue</h3>
      <p>$3,200</p>
    </div>

    <div class="card">
      <h3>Tasks</h3>
      <p>8 Pending</p>
    </div>
  </div>
</div>

</body>
</html>
